<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferrofluid Playground</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #04060a;
  --panel-bg: rgba(12, 18, 30, 0.92);
  --text: #e6ecf7;
  --accent: #1e90ff;
  --shadow: rgba(0, 0, 0, 0.35);
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #0b1020, #04060a 70%);
  color: var(--text);
  min-height: 100vh;
}

.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: 100vh;
}

.controls {
  padding: 1.5rem;
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 40px var(--shadow);
  z-index: 2;
}

.controls h1 {
  margin: 0 0 0.5rem;
  font-size: 1.6rem;
}

.controls form {
  display: grid;
  gap: 1rem;
}

fieldset {
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 0.75rem 1rem 1rem;
  background: rgba(255, 255, 255, 0.02);
}

legend {
  padding: 0 0.35rem;
  font-weight: 600;
}

label {
  display: flex;
  flex-direction: column;
  font-size: 0.9rem;
  gap: 0.25rem;
  margin-top: 0.5rem;
}

label.checkbox {
  flex-direction: row;
  align-items: center;
  gap: 0.5rem;
}

input, select, button {
  font: inherit;
  color: inherit;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 0.4rem 0.5rem;
  border-radius: 6px;
}

select {
  appearance: none;
  background-color: rgba(12, 18, 30, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding-right: 2rem;
  background-image: linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, 0.6) 50%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.6) 50%, transparent 50%);
  background-position: calc(100% - 1.2rem) 50%, calc(100% - 0.7rem) 50%;
  background-size: 0.5rem 0.5rem, 0.5rem 0.5rem;
  background-repeat: no-repeat;
}

select:focus {
  outline: 2px solid rgba(94, 152, 255, 0.7);
  outline-offset: 2px;
}

select option {
  background: rgba(7, 12, 24, 0.94);
  color: #e6ecf7;
}

.button-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

.button-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

.button-row button {
  flex: 1;
}

input[type="range"] {
  padding: 0;
  accent-color: var(--accent);
}

input[type="color"] {
  padding: 0;
  border: none;
  height: 2.2rem;
}

button {
  background: linear-gradient(135deg, var(--accent), #5f7bff);
  border: none;
  padding: 0.65rem;
  cursor: pointer;
  transition: transform 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
}

.canvas-wrapper {
  position: relative;
  overflow: hidden;
}

#ferro-canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: transparent;
}

.hint {
  font-size: 0.8rem;
  opacity: 0.7;
}

@media (max-width: 960px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .controls {
    position: sticky;
    top: 0;
  }

  .canvas-wrapper {
    min-height: 70vh;
  }
}

</style>
</head>
<body>
  <main class="layout">
    <section class="controls">
      <h1>Ferrofluid Playground</h1>
      <p>Tweak the settings to create your own ferrofluid magnet show.</p>
      <form id="controls-form">
        <fieldset>
          <legend>Particles</legend>
          <label title="Number of ferrofluid particles rendered each frame">
            Count
            <input type="range" id="particle-count" min="100" max="2000" step="50" value="700" />
          </label>
          <label title="Choose the geometric sprite used for each particle">
            Shape
            <select id="particle-shape">
              <option value="circle">Circle</option>
              <option value="square">Square</option>
              <option value="triangle">Triangle</option>
            </select>
          </label>
          <label title="Base colour tint applied to all particles">
            Base Color
            <input type="color" id="particle-color" value="#1e90ff" />
          </label>
          <label title="Halo size around each particle">
            Glow
            <input type="range" id="particle-glow" min="0" max="40" value="12" />
          </label>
          <label title="Overall movement speed for the particle swarm">
            Particle Speed
            <input type="range" id="particle-speed" min="0.2" max="3" step="0.05" value="1" />
          </label>
        </fieldset>
        <fieldset>
          <legend>Magnet</legend>
          <label title="Strength of the magnetic attraction or repulsion">
            Strength
            <input type="range" id="magnet-strength" min="50" max="600" value="220" />
          </label>
          <label title="Controls how quickly the field weakens with distance">
            Falloff
            <input type="range" id="magnet-falloff" min="0.5" max="4" step="0.1" value="1.6" />
          </label>
          <label title="Radius of the magnet indicator and influence bubble">
            Magnet Size
            <input type="range" id="magnet-size" min="10" max="60" step="1" value="22" />
          </label>
          <label title="Colour accent for the magnet indicator">
            Magnet Color
            <input type="color" id="magnet-color" value="#ff4500" />
          </label>
          <div class="button-row">
            <button type="button" id="magnet-add" title="Drop an extra magnet at the centre">Add Magnet</button>
            <button type="button" id="magnet-reset" title="Remove extra magnets and return to one">Reset Magnets</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Field Lines</legend>
          <label class="checkbox" title="Toggle visualisation of magnetic field lines">
            <input type="checkbox" id="show-field-lines" checked />
            Show field lines
          </label>
          <label title="Colour applied to the field line trails">
            Line Color
            <input type="color" id="field-line-color" value="#ffffff" />
          </label>
        </fieldset>
        <fieldset>
          <legend>Game of Life</legend>
          <label class="checkbox" title="Switch to a Game of Life cellular automaton simulation">
            <input type="checkbox" id="life-mode" />
            Enable Life mode
          </label>
          <label title="How many Life generations update every second">
            Life Speed
            <input type="range" id="life-speed" min="1" max="30" value="10" />
          </label>
          <label title="Pixel size of each Life cell">
            Cell Size
            <input type="range" id="life-cell-size" min="6" max="40" value="16" />
          </label>
          <label title="Birth/survival rule in B/S format (e.g. B3/S23)">
            Rule
            <input type="text" id="life-rule" value="B3/S23" />
          </label>
          <label title="Quickly apply a popular Life-like rule">
            Preset
            <select id="life-preset">
              <option value="custom">Custom (keep current)</option>
              <option value="B3/S23">Classic Life (B3/S23)</option>
              <option value="B36/S23">HighLife (B36/S23)</option>
              <option value="B2/S">Seeds (B2/S)</option>
              <option value="B3678/S34678">Day & Night (B3678/S34678)</option>
              <option value="B1357/S1357">Replicator (B1357/S1357)</option>
              <option value="B3/S012345678">Life Without Death (B3/S012345678)</option>
            </select>
          </label>
          <label title="How strongly the magnet biases Life cells when nearby">
            Magnet Influence
            <input type="range" id="life-magnet-bias" min="0" max="1" step="0.05" value="0.4" />
          </label>
          <label title="Colour used for alive Life cells">
            Alive Colour
            <input type="color" id="life-alive-color" value="#1e90ff" />
          </label>
          <label title="Colour used for dead Life cells">
            Dead Colour
            <input type="color" id="life-dead-color" value="#0b1020" />
          </label>
          <div class="button-row">
            <button type="button" id="life-randomize" title="Reseed Life grid with a random pattern">Randomize Life</button>
            <button type="button" id="life-clear" title="Clear all Life cells">Clear Life</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Screensaver</legend>
          <label class="checkbox" title="Toggle autonomous magnet drift and palette shifts">
            <input type="checkbox" id="screensaver-enabled" />
            Enable screensaver mode
          </label>
          <label title="Speed at which magnets drift while screensaver is active">
            Drift Speed
            <input type="range" id="screensaver-drift" min="0" max="40" value="14" />
          </label>
          <label title="Seconds between automatic preset swaps">
            Preset Interval (s)
            <input type="range" id="screensaver-interval" min="5" max="60" value="20" />
          </label>
          <button type="button" id="screensaver-randomize" title="Randomize magnet drift phases and pick a fresh theme">Shuffle Screensaver</button>
        </fieldset>
        <button type="button" id="reset-button" title="Respawn the particle swarm">Reset particles</button>
      </form>
      <p class="hint">Click or drag to move the magnet. Hold <kbd>Shift</kbd> to repel.</p>
    </section>
    <section class="canvas-wrapper">
      <canvas id="ferro-canvas"></canvas>
    </section>
  </main>
  <script>
(() => {
const defaultState = {
  particleCount: 700,
  particleColor: '#1e90ff',
  particleShape: 'circle',
  particleGlow: 12,
  particleSpeed: 1,
  magnetStrength: 220,
  magnetFalloff: 1.6,
  magnetSize: 22,
  magnetColor: '#ff4500',
  showFieldLines: true,
  fieldLineColor: '#ffffff',
  lifeMode: false,
  lifeSpeed: 10,
  lifeCellSize: 16,
  lifeRule: 'B3/S23',
  lifeMagnetBias: 0.4,
  lifeAliveColor: '#1e90ff',
  lifeDeadColor: '#0b1020',
  screensaverEnabled: false,
  screensaverDrift: 14,
  screensaverInterval: 20,
};

/**
 * Parse a Life rule string (e.g. B3/S23) into lookup masks.
 * @param {string} ruleString
 * @returns {{ rule: string, birthMask: boolean[], surviveMask: boolean[] }}
 */
function parseLifeRule(ruleString) {
  const defaultRule = {
    rule: 'B3/S23',
    birthMask: (() => {
      const arr = new Array(9).fill(false);
      arr[3] = true;
      return arr;
    })(),
    surviveMask: (() => {
      const arr = new Array(9).fill(false);
      arr[2] = true;
      arr[3] = true;
      return arr;
    })(),
  };

  if (!ruleString) return defaultRule;

  const cleaned = ruleString.trim().toUpperCase();
  const match = cleaned.match(/^B(\d*)\/?S(\d*)$/);
  if (!match) return defaultRule;

  const parseDigits = (digits) =>
    [...new Set(digits.split('').map((d) => parseInt(d, 10)).filter((n) => n >= 0 && n <= 8))];

  const birthDigits = parseDigits(match[1]);
  const surviveDigits = parseDigits(match[2]);

  if (birthDigits.length === 0 && surviveDigits.length === 0) {
    return defaultRule;
  }

  const birthMask = new Array(9).fill(false);
  birthDigits.forEach((n) => {
    birthMask[n] = true;
  });

  const surviveMask = new Array(9).fill(false);
  surviveDigits.forEach((n) => {
    surviveMask[n] = true;
  });

  const normalized = `B${birthDigits.join('')}/S${surviveDigits.join('')}`;

  return { rule: normalized, birthMask, surviveMask };
}

/**
 * Grid-based Game of Life engine with optional magnet influence.
 */
class LifeAutomaton {
  constructor() {
    this.cols = 0;
    this.rows = 0;
    this.cellSize = 16;
    this.grid = new Uint8Array(0);
    this.buffer = new Uint8Array(0);
    this.birthMask = new Array(9).fill(false);
    this.surviveMask = new Array(9).fill(false);
    this.rule = 'B3/S23';
    this.accumulator = 0;
    this.seeded = false;
  }

  /**
   * Update simulation state.
   * @param {number} dt Seconds since last frame.
   * @param {object} state Global settings containing lifeSpeed, lifeMagnetBias, etc.
   * @param {Array<object>} magnets Active magnets influencing the grid.
   * @param {number} canvasWidth
   * @param {number} canvasHeight
   */
  update(dt, state, magnets, canvasWidth, canvasHeight) {
    this.ensureGrid(state, canvasWidth, canvasHeight);
    if (!this.cols || !this.rows) return;

    const speed = Math.max(1, state.lifeSpeed);
    const interval = 1 / speed;
    this.accumulator += dt;

    while (this.accumulator >= interval) {
      this.accumulator -= interval;
      this.stepGeneration(state, magnets);
    }
  }

  /**
   * Render the grid.
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} state
   */
  draw(ctx, state) {
    if (!this.cols || !this.rows || this.grid.length === 0) return;

    const aliveColor = state.lifeAliveColor;
    const deadColor = state.lifeDeadColor;
    const cellSize = this.cellSize;
    const inner = Math.max(cellSize * 0.7, cellSize - 2);
    const margin = (cellSize - inner) * 0.5;

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    for (let y = 0; y < this.rows; y += 1) {
      for (let x = 0; x < this.cols; x += 1) {
        const idx = y * this.cols + x;
        ctx.fillStyle = this.grid[idx] ? aliveColor : deadColor;
        const drawX = x * cellSize + margin;
        const drawY = y * cellSize + margin;
        ctx.fillRect(drawX, drawY, inner, inner);
      }
    }

    ctx.restore();
  }

  /**
   * Ensure grid fits the current canvas/setting configuration.
   * @param {object} state
   * @param {number} width
   * @param {number} height
   * @param {boolean} force
   */
  ensureGrid(state, width, height, force = false) {
    const safeWidth = Number.isFinite(width) ? width : this.cols * this.cellSize || 0;
    const safeHeight = Number.isFinite(height) ? height : this.rows * this.cellSize || 0;
    const desiredCell = Math.max(6, Math.min(40, state.lifeCellSize));
    if (desiredCell !== this.cellSize) {
      this.cellSize = desiredCell;
      force = true;
    }

    const cols = Math.max(4, Math.floor(safeWidth / this.cellSize)) || 4;
    const rows = Math.max(4, Math.floor(safeHeight / this.cellSize)) || 4;

    if (!force && cols === this.cols && rows === this.rows) {
      return;
    }

    const oldCols = this.cols;
    const oldRows = this.rows;
    const oldGrid = this.grid;

    const newGrid = new Uint8Array(cols * rows);
    const newBuffer = new Uint8Array(cols * rows);

    if (oldGrid && oldGrid.length && oldCols && oldRows) {
      const copyCols = Math.min(cols, oldCols);
      const copyRows = Math.min(rows, oldRows);
      for (let y = 0; y < copyRows; y += 1) {
        for (let x = 0; x < copyCols; x += 1) {
          newGrid[y * cols + x] = oldGrid[y * oldCols + x];
        }
      }
    }

    this.cols = cols;
    this.rows = rows;
    this.grid = newGrid;
    this.buffer = newBuffer;
    this.seeded = newGrid.some((value) => value === 1);
  }

  /**
   * Advance Life by one generation.
   * @param {object} state
   * @param {object} magnet
   */
  stepGeneration(state, magnets) {
    const { cols, rows, grid, buffer, cellSize, birthMask, surviveMask } = this;
    if (!grid.length) return;

    const magnetRadius = state.magnetSize * 2.4;
    const magnetBias = state.lifeMagnetBias;

    for (let y = 0; y < rows; y += 1) {
      for (let x = 0; x < cols; x += 1) {
        const idx = y * cols + x;
        const alive = grid[idx];

        let neighbors = 0;
        for (let ny = -1; ny <= 1; ny += 1) {
          for (let nx = -1; nx <= 1; nx += 1) {
            if (nx === 0 && ny === 0) continue;
            const cx = (x + nx + cols) % cols;
            const cy = (y + ny + rows) % rows;
            neighbors += grid[cy * cols + cx];
          }
        }

        let nextState = alive ? (surviveMask[neighbors] ? 1 : 0) : (birthMask[neighbors] ? 1 : 0);

        if (magnetBias > 0 && magnetRadius > 0 && magnets && magnets.length) {
          const cellCenterX = x * cellSize + cellSize * 0.5;
          const cellCenterY = y * cellSize + cellSize * 0.5;

          let attractInfluence = 0;
          let repelInfluence = 0;

          magnets.forEach((magnet) => {
            const dx = magnet.x - cellCenterX;
            const dy = magnet.y - cellCenterY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < magnetRadius) {
              const influence = (1 - dist / magnetRadius) * magnetBias;
              if (magnet.mode > 0) {
                attractInfluence = Math.max(attractInfluence, influence);
              } else if (magnet.mode < 0) {
                repelInfluence = Math.max(repelInfluence, influence);
              }
            }
          });

          if (attractInfluence > 0 && Math.random() < attractInfluence) {
            nextState = 1;
          }
          if (repelInfluence > 0 && Math.random() < repelInfluence) {
            nextState = 0;
          }
        }

        buffer[idx] = nextState;
      }
    }

    this.grid = buffer;
    this.buffer = grid;
  }

  /** Randomise the grid. */
  randomize(density = 0.4) {
    if (!this.grid.length) return;
    for (let i = 0; i < this.grid.length; i += 1) {
      this.grid[i] = Math.random() < density ? 1 : 0;
    }
    if (this.buffer && this.buffer.length === this.grid.length) {
      this.buffer.fill(0);
    }
    this.seeded = true;
  }

  /** Clear all cells. */
  clear() {
    if (this.grid) this.grid.fill(0);
    if (this.buffer) this.buffer.fill(0);
    this.seeded = false;
  }

  /** Apply a Life rule string. */
  applyRule(ruleString) {
    const { rule, birthMask, surviveMask } = parseLifeRule(ruleString);
    this.rule = rule;
    this.birthMask = birthMask;
    this.surviveMask = surviveMask;
  }
}

/**
 * Represents a single magnet that can attract or repel particles/Life cells.
 */
class Magnet {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.homeX = 0;
    this.homeY = 0;
    this.mode = 1;
    this.isActive = false;
    this.anchored = false;
  }

  setHome(width, height) {
    this.homeX = width * 0.5;
    this.homeY = height * 0.5;
    if (!this.anchored) {
      this.x = this.homeX;
      this.y = this.homeY;
    }
  }

  clamp(width, height, radius) {
    const minX = radius;
    const maxX = Math.max(radius, width - radius);
    const minY = radius;
    const maxY = Math.max(radius, height - radius);
    this.x = Math.min(Math.max(this.x, minX), maxX);
    this.y = Math.min(Math.max(this.y, minY), maxY);
  }

  beginInteraction(x, y, width, height, radius) {
    this.isActive = true;
    this.anchored = false;
    this.setPosition(x, y, width, height, radius);
  }

  move(x, y, width, height, radius) {
    this.setPosition(x, y, width, height, radius);
    this.isActive = true;
  }

  endInteraction() {
    this.isActive = false;
    this.anchored = true;
  }

  setPosition(x, y, width, height, radius) {
    this.x = x;
    this.y = y;
    this.clamp(width, height, radius);
  }

  setShiftPressed(pressed) {
    this.mode = pressed ? -1 : 1;
  }
}

/**
 * Handles particle integration and rendering for ferrofluid mode.
 */
class ParticleSystem {
  constructor() {
    this.particles = [];
    this.width = 0;
    this.height = 0;
  }

  setBounds(width, height) {
    this.width = width;
    this.height = height;
  }

  /** Reset with a fresh set of particles. */
  reset(count) {
    this.particles = [];
    for (let i = 0; i < count; i += 1) {
      this.particles.push(this.createParticle());
    }
  }

  /** Ensure number of particles matches requested count. */
  setCount(count) {
    const target = Math.max(0, count);
    const current = this.particles.length;
    if (target === current) return;
    if (target > current) {
      for (let i = 0; i < target - current; i += 1) {
        this.particles.push(this.createParticle());
      }
    } else {
      this.particles.splice(target);
    }
  }

  /** Integrate velocities under magnet forces. */
  update(dt, state, magnets) {
    const particles = this.particles;
    if (!particles.length || !magnets || !magnets.length) return;

    const strength = state.magnetStrength;
    const falloff = state.magnetFalloff;
    const speed = state.particleSpeed;
    const magnetRadius = state.magnetSize;
    const sizeScale = magnetRadius / 22;

    const dtSeconds = Math.min(0.05, dt) * speed;
    const frameFactor = dtSeconds * 60;
    const damping = Math.pow(0.88, frameFactor);
    const jitterStrength = (18 + strength * 0.15) * dtSeconds;

    for (let i = 0; i < particles.length; i += 1) {
      const p = particles[i];
      let accumVx = 0;
      let accumVy = 0;

      magnets.forEach((magnet) => {
        const dx = magnet.x - p.x;
        const dy = magnet.y - p.y;
        const distSq = dx * dx + dy * dy + 0.0001;
        const dist = Math.sqrt(distSq);
        const normX = dx / dist;
        const normY = dy / dist;

        const field = strength * 130000 * sizeScale / Math.pow(dist + magnetRadius * 0.9, falloff + 1);
        const force = Math.max(-3000, Math.min(3000, field * magnet.mode));
        accumVx += normX * force * dtSeconds;
        accumVy += normY * force * dtSeconds;

        const swirl = (0.52 + strength / 420) * magnet.mode;
        const swirlScale = dtSeconds * 140 * sizeScale / (dist / 80 + 1.1);
        accumVx += -normY * swirl * swirlScale;
        accumVy += normX * swirl * swirlScale;
      });

      p.vx += accumVx;
      p.vy += accumVy;

      p.vx *= damping;
      p.vy *= damping;

      const jitter = (Math.sin(p.noise) + Math.cos(p.noise * 0.37)) * 0.5;
      p.vx += Math.sin(p.noise * 1.7) * jitterStrength * jitter;
      p.vy += Math.cos(p.noise * 1.3) * jitterStrength * jitter;
      p.noise += frameFactor * (0.005 + Math.random() * 0.004);

      p.x += p.vx * dtSeconds;
      p.y += p.vy * dtSeconds;
      p.rotation += p.spin * dt * speed;

      if (p.x < -20 || p.x > this.width + 20 || p.y < -20 || p.y > this.height + 20) {
        p.x = Math.random() * this.width;
        p.y = Math.random() * this.height;
        p.vx *= 0.2;
        p.vy *= 0.2;
      }
    }
  }

  /** Draw current particles. */
  draw(ctx, state) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = state.particleColor;
    ctx.strokeStyle = state.particleColor;
    ctx.shadowColor = state.particleColor;
    ctx.shadowBlur = state.particleGlow;
    const shape = state.particleShape;

    for (let i = 0; i < this.particles.length; i += 1) {
      const p = this.particles[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      switch (shape) {
        case 'square':
          ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
          break;
        case 'triangle':
          ctx.beginPath();
          ctx.moveTo(0, -p.size * 0.65);
          ctx.lineTo(p.size * 0.6, p.size * 0.5);
          ctx.lineTo(-p.size * 0.6, p.size * 0.5);
          ctx.closePath();
          ctx.fill();
          break;
        default:
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
          ctx.fill();
      }
      ctx.restore();
    }

    ctx.restore();
  }

  createParticle() {
    const size = 3.5 + Math.random() * 3.5;
    return {
      x: Math.random() * (this.width || 400),
      y: Math.random() * (this.height || 400),
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 20,
      size,
      noise: Math.random() * Math.PI * 2,
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 2,
    };
  }
}

/**
 * Central simulation orchestrator: manages canvas, state, magnet, particles, and Life mode.
 */
class FerroSimulation {
  constructor(canvas, initialState = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: true });
    this.state = { ...defaultState, ...initialState };

    this.dpr = window.devicePixelRatio || 1;
    this.width = 0;
    this.height = 0;

    this.pointerDown = false;
    this.shiftPressed = false;

    this.magnets = [new Magnet()];
    this.activeMagnet = this.magnets[0];
    this.particles = new ParticleSystem();
    this.life = new LifeAutomaton();
    this.life.applyRule(this.state.lifeRule);

    this.lastTimestamp = 0;
    this.running = false;
    this.screensaver = {
      active: this.state.screensaverEnabled,
      elapsed: 0,
      nextTransition: this.state.screensaverInterval,
      driftSeeds: this.generateDriftSeeds(),
    };

    this.loop = this.loop.bind(this);
    this.handlePointerDown = this.handlePointerDown.bind(this);
    this.handlePointerUp = this.handlePointerUp.bind(this);
    this.handlePointerMove = this.handlePointerMove.bind(this);
    this.handlePointerLeave = this.handlePointerLeave.bind(this);
    this.handleKeyDown = this.handleKeyDown.bind(this);
    this.handleKeyUp = this.handleKeyUp.bind(this);

    this.randomizeLife = this.randomizeLife.bind(this);
    this.clearLife = this.clearLife.bind(this);

    this.resizeObserver = null;
    this.resizeListener = null;
    if (typeof ResizeObserver !== 'undefined') {
      this.resizeObserver = new ResizeObserver(() => this.resize());
      this.resizeObserver.observe(this.canvas);
    } else {
      this.resizeListener = () => this.resize();
      window.addEventListener('resize', this.resizeListener);
    }

    this.attachEvents();
    this.resize();
    this.particles.reset(this.state.particleCount);
  }

  attachEvents() {
    this.canvas.addEventListener('pointerdown', this.handlePointerDown);
    window.addEventListener('pointerup', this.handlePointerUp);
    this.canvas.addEventListener('pointermove', this.handlePointerMove);
    this.canvas.addEventListener('pointerleave', this.handlePointerLeave);
    window.addEventListener('keydown', this.handleKeyDown);
    window.addEventListener('keyup', this.handleKeyUp);
  }

  detachEvents() {
    this.canvas.removeEventListener('pointerdown', this.handlePointerDown);
    window.removeEventListener('pointerup', this.handlePointerUp);
    this.canvas.removeEventListener('pointermove', this.handlePointerMove);
    this.canvas.removeEventListener('pointerleave', this.handlePointerLeave);
    window.removeEventListener('keydown', this.handleKeyDown);
    window.removeEventListener('keyup', this.handleKeyUp);
    if (this.resizeObserver) {
      this.resizeObserver.disconnect();
    }
    if (this.resizeListener) {
      window.removeEventListener('resize', this.resizeListener);
    }
  }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.dpr = window.devicePixelRatio || 1;
    this.canvas.width = Math.round(rect.width * this.dpr);
    this.canvas.height = Math.round(rect.height * this.dpr);
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.scale(this.dpr, this.dpr);
    this.width = rect.width;
    this.height = rect.height;

    this.magnets.forEach((magnet) => {
      magnet.setHome(this.width, this.height);
      magnet.clamp(this.width, this.height, this.state.magnetSize);
    });

    this.particles.setBounds(this.width, this.height);

    if (this.state.lifeMode) {
      this.life.ensureGrid(this.state, this.width, this.height, true);
      if (!this.life.seeded) {
        this.life.randomize(0.42);
      }
    }
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.lastTimestamp = performance.now();
    requestAnimationFrame(this.loop);
  }

  stop() {
    this.running = false;
  }

  loop(timestamp) {
    if (!this.running) return;
    const deltaMs = Math.min(64, Math.max(8, timestamp - this.lastTimestamp || 16));
    this.lastTimestamp = timestamp;
    const dt = deltaMs / 1000;

    this.step(dt);
    requestAnimationFrame(this.loop);
  }

  step(dt) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4, 6, 10, 0.32)';
    ctx.fillRect(0, 0, this.width, this.height);
    ctx.restore();

    this.updateMagnets(dt);
    if (this.state.lifeMode) {
      this.life.update(dt, this.state, this.magnets, this.width, this.height);
    } else {
      this.particles.update(dt, this.state, this.magnets);
    }
    this.render();
  }

  updateMagnets(dt) {
    const driftEnabled = this.screensaver.active;
    const driftSpeed = this.state.screensaverDrift;
    this.magnets.forEach((magnet, index) => {
      magnet.setShiftPressed(this.shiftPressed);
      if (driftEnabled) {
        const seeds = this.screensaver.driftSeeds[index % this.screensaver.driftSeeds.length];
        const radius = seeds.radius * Math.min(this.width, this.height) * 0.5;
        const speedX = driftSpeed * seeds.speedX;
        const speedY = driftSpeed * seeds.speedY;
        magnet.x = this.width * 0.5 + Math.cos(seeds.phaseX + this.screensaver.elapsed * speedX) * radius;
        magnet.y = this.height * 0.5 + Math.sin(seeds.phaseY + this.screensaver.elapsed * speedY) * radius;
        magnet.clamp(this.width, this.height, this.state.magnetSize);

        if (seeds.flipInterval > 0 && this.screensaver.elapsed % seeds.flipInterval < dt) {
          magnet.mode = magnet.mode > 0 ? -1 : 1;
        }
      }
    });

    if (driftEnabled) {
      this.screensaver.elapsed += dt;
      if (this.screensaver.elapsed >= this.screensaver.nextTransition) {
        this.triggerScreensaverTransition();
        this.screensaver.elapsed = 0;
        this.screensaver.nextTransition = this.state.screensaverInterval;
      }
    }
  }

  render() {
    if (this.state.showFieldLines) {
      this.drawFieldLines();
    }
    if (this.state.lifeMode) {
      this.life.draw(this.ctx, this.state);
    } else {
      this.particles.draw(this.ctx, this.state);
    }
    this.drawMagnet();
  }

  drawFieldLines() {
    const ctx = this.ctx;
    const color = this.state.fieldLineColor;
    const radius = this.state.magnetSize;
    const lines = 28;
    const maxSteps = 96;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.22;

    this.magnets.forEach((magnet) => {
      for (let i = 0; i < lines; i += 1) {
        const angle = (i / lines) * Math.PI * 2;
        let x = magnet.x + Math.cos(angle) * (radius + 4);
        let y = magnet.y + Math.sin(angle) * (radius + 4);
        ctx.beginPath();
        ctx.moveTo(x, y);

        let stepX = x;
        let stepY = y;
        for (let s = 0; s < maxSteps; s += 1) {
          const dx = magnet.x - stepX;
          const dy = magnet.y - stepY;
          const distSq = dx * dx + dy * dy + 0.0001;
          const dist = Math.sqrt(distSq);
          const normX = dx / dist;
          const normY = dy / dist;
          const force = this.state.magnetStrength * (radius / 18) * 50 / Math.pow(dist + radius, this.state.magnetFalloff + 0.3);

          const tangentX = -normY;
          const tangentY = normX;
          const swirl = (18 + radius * 0.4) / (dist / 40 + 1);

          stepX += (normX * force * magnet.mode * -0.02 + tangentX * swirl * 0.05);
          stepY += (normY * force * magnet.mode * -0.02 + tangentY * swirl * 0.05);

          if (stepX < -40 || stepX > this.width + 40 || stepY < -40 || stepY > this.height + 40) {
            break;
          }

          ctx.lineTo(stepX, stepY);
        }
        ctx.stroke();
      }
    });
    ctx.restore();
  }

  drawMagnet() {
    const ctx = this.ctx;
    const radius = this.state.magnetSize;
    this.magnets.forEach((magnet) => {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.translate(magnet.x, magnet.y);
      ctx.fillStyle = this.state.magnetColor;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = magnet === this.activeMagnet ? 3 : 2;
      ctx.globalAlpha = magnet.isActive ? 0.9 : 0.6;

      ctx.shadowColor = this.state.magnetColor;
      ctx.shadowBlur = magnet === this.activeMagnet ? 26 : 18;

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.beginPath();
      if (magnet.mode > 0) {
        ctx.moveTo(-radius * 0.6, 0);
        ctx.lineTo(radius * 0.6, 0);
        ctx.moveTo(0, -radius * 0.6);
        ctx.lineTo(0, radius * 0.6);
      } else {
        ctx.moveTo(-radius * 0.6, 0);
        ctx.lineTo(radius * 0.6, 0);
      }
      ctx.stroke();
      ctx.restore();
    });
  }

  handlePointerDown(event) {
    const pos = this.getPointerPosition(event);
    if (!pos) return;
    this.pointerDown = true;
    this.activeMagnet = this.findClosestMagnet(pos.x, pos.y) || this.magnets[0];
    this.activeMagnet.beginInteraction(pos.x, pos.y, this.width, this.height, this.state.magnetSize);
    if (this.canvas.setPointerCapture) {
      try {
        this.canvas.setPointerCapture(event.pointerId);
      } catch (err) {
        // ignore pointer capture errors
      }
    }
  }

  handlePointerUp(event) {
    this.pointerDown = false;
    if (this.activeMagnet) {
      this.activeMagnet.endInteraction();
    }
    if (event && this.canvas.releasePointerCapture) {
      try {
        this.canvas.releasePointerCapture(event.pointerId);
      } catch (err) {
        // ignore release errors
      }
    }
  }

  handlePointerMove(event) {
    if (!this.pointerDown || !this.activeMagnet) return;
    const pos = this.getPointerPosition(event);
    if (!pos) return;
    this.activeMagnet.move(pos.x, pos.y, this.width, this.height, this.state.magnetSize);
  }

  handlePointerLeave() {
    this.pointerDown = false;
    if (this.activeMagnet) {
      this.activeMagnet.endInteraction();
    }
  }

  handleKeyDown(event) {
    if (event.key === 'Shift') {
      this.shiftPressed = true;
      this.magnets.forEach((magnet) => magnet.setShiftPressed(true));
    }
  }

  handleKeyUp(event) {
    if (event.key === 'Shift') {
      this.shiftPressed = false;
      this.magnets.forEach((magnet) => magnet.setShiftPressed(false));
    }
  }

  getPointerPosition(event) {
    const rect = this.canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    if (Number.isNaN(x) || Number.isNaN(y)) {
      return null;
    }
    return { x, y };
  }

  /** Update global state and propagate side-effects. */
  setState(partial) {
    const prevCount = this.state.particleCount;
    this.state = { ...this.state, ...partial };

    if (partial.particleCount !== undefined && partial.particleCount !== prevCount) {
      this.particles.setCount(this.state.particleCount);
    }

    if (partial.particleGlow !== undefined) {
      this.state.particleGlow = Math.max(0, partial.particleGlow);
    }

    if (partial.particleSpeed !== undefined) {
      this.state.particleSpeed = Math.max(0.2, Math.min(3, partial.particleSpeed));
    }

    if (partial.magnetSize !== undefined) {
      this.state.magnetSize = Math.max(10, Math.min(60, partial.magnetSize));
      this.magnets.forEach((magnet) => magnet.clamp(this.width, this.height, this.state.magnetSize));
    }

    if (partial.lifeMode !== undefined) {
      this.setLifeMode(Boolean(partial.lifeMode));
    }

    if (partial.lifeSpeed !== undefined) {
      this.state.lifeSpeed = Math.max(1, Math.min(60, partial.lifeSpeed));
    }

    if (partial.lifeCellSize !== undefined) {
      this.state.lifeCellSize = Math.max(6, Math.min(40, partial.lifeCellSize));
      if (this.state.lifeMode) {
        this.life.ensureGrid(this.state, this.width, this.height, true);
      }
    }

    if (partial.lifeRule !== undefined) {
      this.life.applyRule(partial.lifeRule);
      this.state.lifeRule = this.life.rule;
    }

    if (partial.lifeMagnetBias !== undefined) {
      this.state.lifeMagnetBias = Math.max(0, Math.min(1, partial.lifeMagnetBias));
    }

    if (partial.lifeAliveColor !== undefined) {
      this.state.lifeAliveColor = partial.lifeAliveColor;
    }

    if (partial.lifeDeadColor !== undefined) {
      this.state.lifeDeadColor = partial.lifeDeadColor;
    }

    if (partial.screensaverEnabled !== undefined) {
      this.setScreensaverEnabled(Boolean(partial.screensaverEnabled));
    }

    if (partial.screensaverDrift !== undefined) {
      this.setScreensaverDrift(Number(partial.screensaverDrift));
    }

    if (partial.screensaverInterval !== undefined) {
      this.setScreensaverInterval(Number(partial.screensaverInterval));
    }
  }

  resetParticles() {
    this.particles.reset(this.state.particleCount);
  }

  randomizeLife(density = 0.45) {
    this.life.ensureGrid(this.state, this.width, this.height);
    this.life.randomize(density);
  }

  clearLife() {
    this.life.clear();
  }

  setLifeMode(enabled) {
    if (enabled === this.state.lifeMode) return;
    this.state.lifeMode = enabled;
    this.life.accumulator = 0;
    if (enabled) {
      this.life.ensureGrid(this.state, this.width, this.height, true);
      if (!this.life.seeded) {
        this.life.randomize(0.42);
      }
    }
  }

  addMagnet() {
    const magnet = new Magnet();
    magnet.anchored = true;
    magnet.x = this.width * 0.5;
    magnet.y = this.height * 0.5;
    magnet.setHome(this.width, this.height);
    magnet.clamp(this.width, this.height, this.state.magnetSize);
    magnet.setShiftPressed(this.shiftPressed);
    this.magnets.push(magnet);
    this.activeMagnet = magnet;
  }

  resetMagnets() {
    const first = this.magnets[0] || new Magnet();
    first.anchored = false;
    first.setHome(this.width, this.height);
    first.clamp(this.width, this.height, this.state.magnetSize);
    first.setShiftPressed(this.shiftPressed);
    this.magnets = [first];
    this.activeMagnet = first;
  }

  findClosestMagnet(x, y) {
    let closest = null;
    let bestDist = Infinity;
    const radius = this.state.magnetSize;
    for (let i = 0; i < this.magnets.length; i += 1) {
      const magnet = this.magnets[i];
      const dx = magnet.x - x;
      const dy = magnet.y - y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestDist) {
        bestDist = dist;
        closest = magnet;
      }
    }
    return bestDist <= radius * 1.2 ? closest : null;
  }

  setScreensaverEnabled(enabled) {
    this.state.screensaverEnabled = enabled;
    this.screensaver.active = enabled;
    this.screensaver.elapsed = 0;
    this.screensaver.nextTransition = this.state.screensaverInterval;
    this.screensaver.driftSeeds = this.generateDriftSeeds();
  }

  setScreensaverDrift(value) {
    this.state.screensaverDrift = Math.max(0, Math.min(60, value));
  }

  setScreensaverInterval(value) {
    this.state.screensaverInterval = Math.max(5, Math.min(120, value));
    this.screensaver.nextTransition = this.state.screensaverInterval;
    this.screensaver.elapsed = 0;
  }

  triggerScreensaverTransition() {
    const theme = FerroSimulation.pickRandomTheme();
    this.setState({
      particleColor: theme.particleColor,
      magnetColor: theme.magnetColor,
      fieldLineColor: theme.fieldColor,
      particleGlow: theme.glow,
    });
    const root = document.documentElement;
    root.style.setProperty('--accent', this.state.particleColor);
    if (this.state.lifeMode && theme.lifeRule) {
      this.setState({ lifeRule: theme.lifeRule });
    }
  }

  static pickRandomTheme() {
    const themes = [
      {
        name: 'Solar Storm',
        particleColor: '#ffb347',
        magnetColor: '#ff4e50',
        fieldColor: '#ffe29f',
        glow: 22,
        lifeRule: 'B36/S23',
      },
      {
        name: 'Ethereal Lagoon',
        particleColor: '#48d1cc',
        magnetColor: '#00aaff',
        fieldColor: '#a1f7ff',
        glow: 18,
        lifeRule: 'B3/S23',
      },
      {
        name: 'Cyber Grid',
        particleColor: '#9d60ff',
        magnetColor: '#ff2bd6',
        fieldColor: '#f7a1ff',
        glow: 24,
        lifeRule: 'B3678/S34678',
      },
      {
        name: 'Aurora Drift',
        particleColor: '#7fffb8',
        magnetColor: '#3c91ff',
        fieldColor: '#c9ffe5',
        glow: 20,
        lifeRule: 'B2/S',
      },
    ];
    return themes[Math.floor(Math.random() * themes.length)];
  }

  randomizeScreensaver() {
    this.screensaver.elapsed = 0;
    this.screensaver.nextTransition = this.state.screensaverInterval;
    this.screensaver.driftSeeds = this.generateDriftSeeds();
    this.triggerScreensaverTransition();
  }

  generateDriftSeeds() {
    const count = Math.max(1, this.magnets.length);
    const seeds = [];
    for (let i = 0; i < count; i += 1) {
      seeds.push({
        phaseX: Math.random() * Math.PI * 2,
        phaseY: Math.random() * Math.PI * 2,
        speedX: 0.04 + Math.random() * 0.06,
        speedY: 0.05 + Math.random() * 0.07,
        radius: 0.25 + Math.random() * 0.35,
        flipInterval: Math.random() > 0.7 ? 8 + Math.random() * 10 : 0,
      });
    }
    return seeds;
  }
}

function updateRangeTooltip(input, formatter = (value) => value) {
  if (!input) return;
  const formatted = formatter(input.value);
  input.title = formatted;
  input.setAttribute('aria-valuetext', formatted);
}

function setupControls(simulation) {
  const form = document.getElementById('controls-form');
  if (!form) return;

  form.addEventListener('submit', (event) => event.preventDefault());

  const root = document.documentElement;
  const get = (id) => /** @type {HTMLInputElement | HTMLSelectElement | HTMLButtonElement | null} */ (
    document.getElementById(id)
  );

  const particleCount = get('particle-count');
  const particleShape = get('particle-shape');
  const particleColor = get('particle-color');
  const particleGlow = get('particle-glow');
  const particleSpeed = get('particle-speed');
  const magnetStrength = get('magnet-strength');
  const magnetFalloff = get('magnet-falloff');
  const magnetSize = get('magnet-size');
  const magnetColor = get('magnet-color');
  const magnetAdd = get('magnet-add');
  const magnetReset = get('magnet-reset');
  const showFieldLines = get('show-field-lines');
  const fieldLineColor = get('field-line-color');
  const resetParticlesButton = get('reset-button');

  const lifeMode = get('life-mode');
  const lifeSpeed = get('life-speed');
  const lifeCellSize = get('life-cell-size');
  const lifeRule = get('life-rule');
  const lifePreset = get('life-preset');
  const lifeMagnetBias = get('life-magnet-bias');
  const lifeAliveColor = get('life-alive-color');
  const lifeDeadColor = get('life-dead-color');
  const lifeRandomize = get('life-randomize');
  const lifeClear = get('life-clear');
  const screensaverEnabled = get('screensaver-enabled');
  const screensaverDrift = get('screensaver-drift');
  const screensaverInterval = get('screensaver-interval');
  const screensaverRandomize = get('screensaver-randomize');

  const syncLifeToggleState = () => {
    if (!lifeMode) return;
    lifeMode.checked = simulation.state.lifeMode;
    const particleControls = [particleCount, particleShape, particleGlow, particleSpeed];
    particleControls.forEach((input) => {
      if (!input) return;
      input.disabled = simulation.state.lifeMode;
    });
  };

  const syncLifePresetSelector = () => {
    if (!lifePreset) return;
    const currentRule = simulation.state.lifeRule;
    const option = Array.from(lifePreset.options).find((opt) => opt.value === currentRule);
    lifePreset.value = option ? option.value : 'custom';
  };

  if (particleCount) {
    particleCount.value = simulation.state.particleCount;
    const formatter = (value) => `${value} particles`;
    updateRangeTooltip(particleCount, formatter);
    particleCount.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ particleCount: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (particleShape) {
    particleShape.value = simulation.state.particleShape;
    particleShape.addEventListener('change', (event) => {
      simulation.setState({ particleShape: event.target.value });
    });
  }

  if (particleColor) {
    particleColor.value = simulation.state.particleColor;
    root.style.setProperty('--accent', simulation.state.particleColor);
    particleColor.addEventListener('input', (event) => {
      const color = event.target.value;
      simulation.setState({ particleColor: color });
      root.style.setProperty('--accent', color);
    });
  }

  if (particleGlow) {
    particleGlow.value = simulation.state.particleGlow;
    const formatter = (value) => `${value}px glow`;
    updateRangeTooltip(particleGlow, formatter);
    particleGlow.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ particleGlow: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (particleSpeed) {
    particleSpeed.value = simulation.state.particleSpeed;
    const formatter = (value) => `${Number(value).toFixed(2)}× speed`;
    updateRangeTooltip(particleSpeed, formatter);
    particleSpeed.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ particleSpeed: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (magnetStrength) {
    magnetStrength.value = simulation.state.magnetStrength;
    const formatter = (value) => `Strength ${value}`;
    updateRangeTooltip(magnetStrength, formatter);
    magnetStrength.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ magnetStrength: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (magnetFalloff) {
    magnetFalloff.value = simulation.state.magnetFalloff;
    const formatter = (value) => `Falloff ${Number(value).toFixed(1)}`;
    updateRangeTooltip(magnetFalloff, formatter);
    magnetFalloff.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ magnetFalloff: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (magnetSize) {
    magnetSize.value = simulation.state.magnetSize;
    const formatter = (value) => `${Math.round(value)}px radius`;
    updateRangeTooltip(magnetSize, formatter);
    magnetSize.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ magnetSize: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (magnetColor) {
    magnetColor.value = simulation.state.magnetColor;
    magnetColor.addEventListener('input', (event) => {
      simulation.setState({ magnetColor: event.target.value });
    });
  }

  if (magnetAdd) {
    magnetAdd.addEventListener('click', () => {
      simulation.addMagnet();
    });
  }

  if (magnetReset) {
    magnetReset.addEventListener('click', () => {
      simulation.resetMagnets();
    });
  }

  if (screensaverEnabled) {
    screensaverEnabled.checked = simulation.state.screensaverEnabled;
    screensaverEnabled.addEventListener('change', (event) => {
      simulation.setState({ screensaverEnabled: event.target.checked });
    });
  }

  if (screensaverDrift) {
    screensaverDrift.value = simulation.state.screensaverDrift;
    const formatter = (value) => `${value} drift`; // simple tooltip
    updateRangeTooltip(screensaverDrift, formatter);
    screensaverDrift.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ screensaverDrift: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (screensaverInterval) {
    screensaverInterval.value = simulation.state.screensaverInterval;
    const formatter = (value) => `${value}s`; // seconds
    updateRangeTooltip(screensaverInterval, formatter);
    screensaverInterval.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ screensaverInterval: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (screensaverRandomize) {
    screensaverRandomize.addEventListener('click', () => {
      simulation.randomizeScreensaver();
    });
  }

  if (lifeMode) {
    syncLifeToggleState();
    lifeMode.addEventListener('change', (event) => {
      simulation.setState({ lifeMode: event.target.checked });
      syncLifeToggleState();
    });
  }

  if (lifeSpeed) {
    lifeSpeed.value = simulation.state.lifeSpeed;
    const formatter = (value) => `${value} gen/s`;
    updateRangeTooltip(lifeSpeed, formatter);
    lifeSpeed.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ lifeSpeed: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (lifeCellSize) {
    lifeCellSize.value = simulation.state.lifeCellSize;
    const formatter = (value) => `${value}px cells`;
    updateRangeTooltip(lifeCellSize, formatter);
    lifeCellSize.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ lifeCellSize: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (lifeRule) {
    lifeRule.value = simulation.state.lifeRule;
    lifeRule.addEventListener('change', (event) => {
      simulation.setState({ lifeRule: event.target.value });
      lifeRule.value = simulation.state.lifeRule;
      syncLifePresetSelector();
    });
  }

  if (lifePreset) {
    syncLifePresetSelector();
    lifePreset.addEventListener('change', (event) => {
      if (event.target.value === 'custom') return;
      simulation.setState({ lifeRule: event.target.value });
      if (lifeRule) {
        lifeRule.value = simulation.state.lifeRule;
      }
      syncLifePresetSelector();
    });
  }

  if (lifeMagnetBias) {
    lifeMagnetBias.value = simulation.state.lifeMagnetBias;
    const formatter = (value) => `${Number(value).toFixed(2)} magnet bias`;
    updateRangeTooltip(lifeMagnetBias, formatter);
    lifeMagnetBias.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      simulation.setState({ lifeMagnetBias: value });
      updateRangeTooltip(event.target, formatter);
    });
  }

  if (lifeAliveColor) {
    lifeAliveColor.value = simulation.state.lifeAliveColor;
    lifeAliveColor.addEventListener('input', (event) => {
      simulation.setState({ lifeAliveColor: event.target.value });
    });
  }

  if (lifeDeadColor) {
    lifeDeadColor.value = simulation.state.lifeDeadColor;
    lifeDeadColor.addEventListener('input', (event) => {
      simulation.setState({ lifeDeadColor: event.target.value });
    });
  }

  if (lifeRandomize) {
    lifeRandomize.addEventListener('click', () => {
      simulation.randomizeLife(0.45);
    });
  }

  if (lifeClear) {
    lifeClear.addEventListener('click', () => {
      simulation.clearLife();
    });
  }

  if (showFieldLines) {
    showFieldLines.checked = simulation.state.showFieldLines;
    if (fieldLineColor) {
      fieldLineColor.disabled = !showFieldLines.checked;
    }
    showFieldLines.addEventListener('change', (event) => {
      const checked = event.target.checked;
      simulation.setState({ showFieldLines: checked });
      if (fieldLineColor) {
        fieldLineColor.disabled = !checked;
      }
    });
  }

  if (fieldLineColor) {
    fieldLineColor.value = simulation.state.fieldLineColor;
    fieldLineColor.addEventListener('input', (event) => {
      simulation.setState({ fieldLineColor: event.target.value });
    });
  }

  if (resetParticlesButton) {
    resetParticlesButton.addEventListener('click', () => {
      simulation.resetParticles();
    });
  }
}

const canvas = document.getElementById('ferro-canvas');
const simulation = new FerroSimulation(canvas);
simulation.start();

setupControls(simulation);
})();
</script>
</body>
</html>
